name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,langchain,agent]'
      - run: ruff check .
      # Includes tests/test_vectors.py: spec/vectors.json must match the Python implementation.
      - run: python -m pytest -q

  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      # The TypeScript tests start real Python MCP/OAuth servers for interoperability.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
        working-directory: ts
      - run: echo "MCPILOT_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - run: npm test
        working-directory: ts

  artifacts:
    needs: [python, typescript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: python -m pip install build
      - run: scripts/build_artifacts.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mcpilot-${{ github.sha }}
          path: dist/
          if-no-files-found: error
